name: Deploy to Orchard

on:
  workflow_run:
    workflows: ['Publish Backend Docker Image']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/publish-docker.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [build]
    if: always() && (github.event.workflow_run.conclusion == 'success' || needs.build.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Orchard deploy
        env:
          WEBHOOK_URL: ${{ secrets.ORCHARD_WEBHOOK_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Production deploys run through Portainer. Orchard is optional, and
          # without its webhook secret this job failed on every push to main —
          # a permanent red X that hides real failures. Skip instead.
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::ORCHARD_WEBHOOK_URL not set — skipping Orchard deploy."
            exit 0
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"sha-${SHORT_SHA}\"}"
