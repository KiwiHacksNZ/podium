name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  ENV_FOR_DYNACONF: development
  PODIUM_DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/podium_test
  PODIUM_JWT_SECRET: ci-test-secret-not-for-production

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: podium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Run backend tests
        working-directory: backend
        run: uv run python -m pytest

      - name: Sync SvelteKit
        working-directory: frontend
        run: bunx svelte-kit sync

      - name: Check frontend
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: bun run svelte-check

      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Check ports are available
        run: |
          # Ensure ports 8000 (backend) and 4174 (frontend) are free
          if lsof -Pi :8000 -sTCP:LISTEN -t >/dev/null 2>&1; then
            echo "❌ Port 8000 already in use"
            exit 1
          fi
          if lsof -Pi :4174 -sTCP:LISTEN -t >/dev/null 2>&1; then
            echo "❌ Port 4174 already in use"
            exit 1
          fi
          echo "✅ Ports 8000 and 4174 are available"

      - name: Run database migrations
        run: |
          cd backend
          uv run alembic upgrade head

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7
