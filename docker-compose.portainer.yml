# Deployed via Portainer (Repository method) on the KiwiHacks VPS.
# Secrets live on the host under /opt/kiwihacks-podium and are bind-mounted:
# env_file cannot be used because Portainer's compose resolves it inside the
# Portainer container, while volume mounts are resolved by the daemon.
services:
  podium-pg:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
      POSTGRES_DB: podium
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - podium_pgdata:/var/lib/postgresql/data
      - /opt/kiwihacks-podium/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: pg_isready -U postgres -d podium
      interval: 30s
      timeout: 5s
      retries: 5

  podium-backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - /opt/kiwihacks-podium/stack.env:/run/secrets/stack.env:ro
      - /opt/kiwihacks-podium/uploads:/app/uploads
    # env is exported line-by-line from the mounted file (no Doppler on the VPS);
    # --proxy-headers so base_url is https behind the cloudflared tunnel,
    # otherwise the derived OAuth redirect_uri mismatches the registered one.
    entrypoint:
      - /bin/bash
      - -c
      - 'while IFS= read -r l; do [ -n "$$l" ] && export "$$l"; done < /run/secrets/stack.env; exec "$$@"'
      - --
    command:
      - uv
      - run
      - python
      - -m
      - uvicorn
      - podium.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      podium-pg: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/openapi.json >/dev/null || exit 1"]
      interval: 30s
      retries: 5
      start_period: 20s

volumes:
  podium_pgdata:
