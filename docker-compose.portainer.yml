# Deployed via Portainer (Repository method) on the KiwiHacks VPS.
# Secrets live on the host under /opt/kiwihacks-podium and are bind-mounted:
# env_file cannot be used because Portainer's compose resolves it inside the
# Portainer container, while volume mounts are resolved by the daemon.
services:
  podium-pg:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
      POSTGRES_DB: podium
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - podium_pgdata:/var/lib/postgresql/data
      - /opt/kiwihacks-podium/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: pg_isready -U postgres -d podium
      interval: 30s
      timeout: 5s
      retries: 5

  podium-backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - /opt/kiwihacks-podium/stack.env:/run/secrets/stack.env:ro
      - /opt/kiwihacks-podium/uploads:/app/uploads
    # env is exported line-by-line from the mounted file (no Doppler on the VPS).
    entrypoint:
      - /bin/bash
      - -c
      - 'while IFS= read -r l; do [ -n "$$l" ] && export "$$l"; done < /run/secrets/stack.env; exec "$$@"'
      - --
    command:
      - /bin/bash
      - -c
      - alembic upgrade head && exec python -m uvicorn podium.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      podium-pg: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready >/dev/null || exit 1"]
      interval: 30s
      retries: 5
      start_period: 20s

# External so a Portainer rebuild re-attaches the existing data regardless of
# stack name. This is the live volume created by the original CLI deploy; do not
# rename it or Postgres will come up empty. Create it once with:
#   docker volume create kiwihacks-podium_podium_pgdata
volumes:
  podium_pgdata:
    external: true
    name: kiwihacks-podium_podium_pgdata
